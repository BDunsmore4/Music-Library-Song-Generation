<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────────────────────
   Two acts.

   FOYER  a warm, ordinary chat. Nothing suggests there is anything else here.
   STAGE  the curtain withdraws and the retrieval is explained, step by step,
          inside the 3-D library — then you are returned to the chat.

   The stage is a DEMONSTRATION, not a place to live. Its job is to show what
   actually happened: the words you typed, the structure Claude turned them
   into, the literal string handed to CLAP, where that lands, and which tracks
   came back as nearest neighbours *in 512 dimensions*. The caption panel is
   the lesson; the point field is the illustration.
   ────────────────────────────────────────────────────────────────────────── */
:root{
  --paper:#faf8f4;  --paper-2:#f3efe8;  --ink:#2a2724;  --ink-2:#6b645c;
  --faint:#b8b0a5;  --rule:#e7e1d7;     --clay:#b5603f;
  --night:#0a0d14;  --glow:#ffd9a0;     --cool:#9fc4ef;  --surt:#f0e6d8;
  --ease:cubic-bezier(.16,.84,.26,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper); color:var(--ink);
  font:400 15px/1.6 'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  overflow:hidden}

#veil{position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
  z-index:60; transition:opacity 1.2s ease}
body.dimming #veil{opacity:1}
body.showing #veil{opacity:0; transition:opacity 2.2s ease .1s}

/* ── FOYER ──────────────────────────────────────────────────────────────── */
#foyer{position:absolute; inset:0; display:flex; flex-direction:column;
  transition:opacity .7s ease}
body.showing #foyer{opacity:0; pointer-events:none}
#foyer header{flex:0 0 auto; padding:18px 22px; display:flex; align-items:baseline; gap:12px}
#foyer header h1{margin:0; font:400 21px/1 'Instrument Serif',Georgia,serif}
#foyer header .sub{color:var(--ink-2); font-size:12.5px}
#foyer header .tog{margin-left:auto; font-size:11.5px; color:var(--faint);
  cursor:pointer; background:none; border:0; font-family:inherit}
#foyer header .tog.on{color:var(--clay)}
#foyer main{flex:1 1 auto; overflow-y:auto; padding:8px 22px 20px}
.thread{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.turn{display:flex}
.turn.me{justify-content:flex-end}
.turn.me .bubble{background:var(--paper-2); border:1px solid var(--rule);
  border-radius:14px 14px 4px 14px; padding:9px 13px; max-width:76%}
.turn.bot .bubble{max-width:100%; white-space:pre-wrap}
.list{display:flex; flex-direction:column; margin-top:4px}
.row{display:flex; align-items:center; gap:11px; padding:7px 9px; border-radius:8px}
.row:hover{background:var(--paper-2)}
.row.wild{box-shadow:inset 2px 0 0 var(--clay)}
.pl{flex:0 0 auto; width:25px; height:25px; border-radius:50%; cursor:pointer;
  padding:0; border:1px solid var(--rule); background:#fff; color:var(--ink); font-size:9px}
.pl.on{background:var(--clay); border-color:var(--clay); color:#fff}
.pl[disabled]{opacity:.35; cursor:default}
.tx{min-width:0; flex:1 1 auto}
.tt{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px}
.ta{color:var(--ink-2); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.wtag{flex:0 0 auto; color:var(--clay); font-size:9.5px; letter-spacing:.07em; text-transform:uppercase}
.vt{flex:0 0 auto; display:flex; gap:3px; opacity:0; transition:opacity .15s}
.row:hover .vt,.vt.set{opacity:1}
.vt button{width:23px;height:23px;padding:0;cursor:pointer;font-size:10px;background:none;
  border:1px solid var(--rule); border-radius:5px; color:var(--faint)}
.vt button.on{color:#fff; background:var(--clay); border-color:var(--clay)}

/* ── composer, which rises to become the surtitle bar ───────────────────── */
#bar{position:fixed; left:50%; transform:translateX(-50%); bottom:26px;
  width:min(680px,calc(100% - 36px)); z-index:40;
  transition:bottom 1.3s var(--ease), top 1.3s var(--ease), width 1.3s var(--ease)}
body.showing #bar{bottom:auto; top:16px; width:min(720px,calc(100% - 28px))}
#bar .wrap{display:flex; gap:9px; align-items:flex-end; background:#fff;
  border:1px solid var(--rule); border-radius:14px; padding:9px 9px 9px 14px;
  box-shadow:0 2px 14px rgba(42,39,36,.06);
  transition:background 1s ease, border-color 1s ease, box-shadow 1s ease}
body.showing #bar .wrap{background:rgba(10,13,20,.66);
  border-color:rgba(240,230,216,.15); box-shadow:0 10px 50px rgba(0,0,0,.6);
  backdrop-filter:blur(7px)}
#q{flex:1 1 auto; border:0; outline:0; resize:none; background:none; font:inherit;
  color:var(--ink); max-height:120px; min-height:24px; padding:3px 0; transition:color 1s ease}
body.showing #q{color:var(--surt); text-align:center}
#q::placeholder{color:var(--faint)}
body.showing #q::placeholder{color:rgba(240,230,216,.35)}
#go{flex:0 0 auto; width:30px; height:30px; border-radius:9px; cursor:pointer;
  padding:0; border:0; background:var(--ink); color:#fff; font-size:13px;
  transition:background 1s ease, opacity .2s}
body.showing #go{background:rgba(240,230,216,.14); color:var(--surt)}
#go[disabled]{opacity:.4; cursor:default}

/* ── STAGE ──────────────────────────────────────────────────────────────── */
#stage{position:fixed; inset:0; background:var(--night); opacity:0;
  pointer-events:none; z-index:10; transition:opacity 1.3s ease}
body.showing #stage{opacity:1}
#sky{width:100%; height:100%; display:block}

.drape{position:fixed; top:0; bottom:0; width:52%; z-index:30; pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.42) 0 7px,
      rgba(255,255,255,.05) 7px 15px, rgba(0,0,0,.42) 15px 22px),
    linear-gradient(90deg,#4a1016,#7d1f26 42%,#5c141b 72%,#36090e);
  box-shadow:0 0 70px rgba(0,0,0,.65) inset; transition:transform 2.6s var(--ease)}
#dl{left:0;  transform:translateX(-101%)}
#dr{right:0; transform:translateX(101%)}
body.dimming #dl,body.dimming #dr{transform:translateX(0)}
body.showing #dl{transform:translateX(-101%)}
body.showing #dr{transform:translateX(101%)}

/* ── the lesson: a panel that builds up, left of the field ──────────────── */
#steps{
  position:fixed; left:26px; top:84px; z-index:35; width:min(420px,calc(100% - 52px));
  max-height:calc(100% - 180px); overflow:hidden;
  display:flex; flex-direction:column; gap:14px;
  opacity:0; transition:opacity .5s ease; pointer-events:none;
}
#steps.show{opacity:1}
.st{opacity:0; transform:translateY(7px); transition:opacity .55s ease, transform .55s var(--ease)}
.st.in{opacity:1; transform:none}
.st .k{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
.st .n{font:500 10px/1 'JetBrains Mono',monospace; color:var(--glow);
  border:1px solid rgba(255,217,160,.35); border-radius:3px; padding:3px 5px}
.st .h{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
  color:rgba(240,230,216,.55)}
.st .b{color:var(--surt); font-size:13.5px; line-height:1.5}
.st .mono{font:400 12px/1.65 'JetBrains Mono',monospace; color:#cfe3ff;
  background:rgba(159,196,239,.07); border-left:2px solid rgba(159,196,239,.35);
  padding:7px 10px; border-radius:0 5px 5px 0; white-space:pre-wrap; word-break:break-word}
.st .lit{font:400 12.5px/1.7 'JetBrains Mono',monospace; color:var(--glow);
  background:rgba(255,217,160,.08); border-left:2px solid rgba(255,217,160,.45);
  padding:7px 10px; border-radius:0 5px 5px 0; white-space:pre-wrap; word-break:break-word}
.st .note{color:rgba(240,230,216,.45); font-size:11.5px; font-style:italic;
  font-family:'Instrument Serif',Georgia,serif; margin-top:5px}

/* in-world metadata labels */
#labels{position:fixed; inset:0; z-index:34; pointer-events:none}
.lab{position:absolute; transform:translate(-50%,-140%); white-space:nowrap;
  font-size:11.5px; color:var(--surt); background:rgba(10,13,20,.72);
  border:1px solid rgba(240,230,216,.14); border-radius:5px; padding:3px 7px;
  opacity:0; transition:opacity .5s ease; backdrop-filter:blur(3px)}
.lab.in{opacity:1}
.lab b{font-weight:500}
.lab span{color:rgba(240,230,216,.55)}
.lab.wild{border-color:rgba(255,217,160,.4)}

#ret{position:fixed; left:50%; transform:translateX(-50%); bottom:26px; z-index:36;
  color:rgba(240,230,216,.5); font-size:12px; opacity:0; transition:opacity .6s ease;
  font-family:'Instrument Serif',Georgia,serif; font-style:italic; pointer-events:none}
#ret.show{opacity:1}
.err{color:var(--clay); font-size:13px}
@media (max-width:760px){
  #steps{left:14px; top:76px; width:calc(100% - 28px); max-height:44%}
  .st .b{font-size:12.5px}
  .vt{opacity:1}
}
</style>
</head>
<body>

<div id="stage"><canvas id="sky"></canvas></div>
<div id="labels"></div>
<div class="drape" id="dl"></div>
<div class="drape" id="dr"></div>
<div id="veil"></div>

<div id="foyer">
  <header>
    <h1>Crate</h1>
    <span class="sub" id="sub">loading…</span>
    <button class="tog" id="tog" hidden>show the mechanism: on</button>
  </header>
  <main id="scrollable"><div class="thread" id="thread"></div></main>
</div>

<div id="steps"></div>
<div id="ret">returning to the chat…</div>

<div id="bar"><div class="wrap">
  <textarea id="q" rows="1" placeholder="What do you feel like?"></textarea>
  <button id="go">↑</button>
</div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

/* ── config ─────────────────────────────────────────────────────────────── */
const API_DEFAULT = "https://music-library-song-generation-production.up.railway.app";
function resolveApi(){
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    return "http://localhost:8765";
  const w = new URLSearchParams(location.search).get("api");
  if (w){ try{ const u=new URL(w);
    if(u.protocol==="https:" && u.hostname.endsWith(".railway.app")) return u.origin;
  }catch(e){} }
  return API_DEFAULT;
}
const API = resolveApi();
const CHAT_KEY = "";

// Forgiving on purpose: punctuation and stray spacing should not cost you the
// surprise. It lives in client source, so it is a surprise, not a secret.
const CODEWORD = "take me to the opera";
const norm = s => String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();

/* ── dom ────────────────────────────────────────────────────────────────── */
const thread=document.getElementById("thread"), q=document.getElementById("q"),
      go=document.getElementById("go"), sub=document.getElementById("sub"),
      stepsEl=document.getElementById("steps"), labelsEl=document.getElementById("labels"),
      retEl=document.getElementById("ret"), tog=document.getElementById("tog");
const H=()=>CHAT_KEY?{"Content-Type":"application/json","X-Chat-Key":CHAT_KEY}
                    :{"Content-Type":"application/json"};
let session=null, busy=false, unlocked=false, showMech=true, audio=null, playing=null;

const el=(t,c,x)=>{const n=document.createElement(t); if(c)n.className=c;
  if(x!==undefined)n.textContent=x; return n;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const scrollDown=()=>{const m=document.getElementById("scrollable"); m.scrollTop=m.scrollHeight;};
function bubble(who,text){const r=el("div","turn "+who), b=el("div","bubble",text);
  r.appendChild(b); thread.appendChild(r); scrollDown(); return b;}

/* ── previews ───────────────────────────────────────────────────────────── */
function preview(url,btn){
  if(playing===btn){audio.pause(); return;}
  if(audio) audio.pause();
  audio=new Audio(url);
  audio.play().catch(()=>{btn.textContent="—"; btn.disabled=true;});
  if(playing){playing.classList.remove("on"); playing.textContent="▶";}
  playing=btn; btn.classList.add("on"); btn.textContent="❙❙";
  audio.onended=audio.onpause=()=>{btn.classList.remove("on"); btn.textContent="▶";
    if(playing===btn) playing=null;};
}
function vote(id,rating,group,hit){
  group.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  hit.classList.add("on"); group.classList.add("set");
  fetch(API+"/api/chat/feedback",{method:"POST",headers:H(),
    body:JSON.stringify({session,track_id:id,rating,source:"ui"})}).catch(()=>{});
}
function foyerTracks(tracks){
  if(!tracks||!tracks.length) return;
  const wrap=el("div","list");
  tracks.forEach(t=>{
    const row=el("div","row"+(t.wildcard?" wild":""));
    const p=el("button","pl",t.preview_url?"▶":"—");
    if(!t.preview_url)p.disabled=true; else p.onclick=()=>preview(t.preview_url,p);
    row.appendChild(p);
    const tx=el("div","tx"); tx.appendChild(el("div","tt",t.name));
    tx.appendChild(el("div","ta",t.artist)); row.appendChild(tx);
    if(t.wildcard) row.appendChild(el("span","wtag","further out"));
    const g=el("div","vt"), up=el("button",null,"▲"), dn=el("button",null,"▼");
    up.onclick=()=>vote(t.track_id,1,g,up); dn.onclick=()=>vote(t.track_id,0,g,dn);
    g.appendChild(up); g.appendChild(dn); row.appendChild(g);
    wrap.appendChild(row);
  });
  const r=el("div","turn bot"); r.appendChild(wrap);
  thread.appendChild(r); scrollDown();
}

/* ── the caption panel: the actual lesson ───────────────────────────────── */
function clearSteps(){ stepsEl.innerHTML=""; stepsEl.classList.remove("show"); }
async function step(n, head, build){
  const d=el("div","st");
  const k=el("div","k"); k.appendChild(el("span","n",String(n))); k.appendChild(el("span","h",head));
  d.appendChild(k); build(d);
  stepsEl.appendChild(d); stepsEl.classList.add("show");
  // keep the newest steps visible if the panel fills up
  while(stepsEl.scrollHeight > stepsEl.clientHeight && stepsEl.children.length>3)
    stepsEl.removeChild(stepsEl.firstChild);
  await wait(30); d.classList.add("in");
  return d;
}

/* ── the point field ────────────────────────────────────────────────────── */
const S = 18;                                    // same world scale as space.html
let renderer, scene, camera, field, lit, halo, P=[], byId=new Map(), raf=null;
let centre=new THREE.Vector3(), spread=600;
let cam={pos:new THREE.Vector3(), tgt:new THREE.Vector3(),
         fromP:new THREE.Vector3(), fromT:new THREE.Vector3(),
         toP:new THREE.Vector3(), toT:new THREE.Vector3(), t:1, dur:1};
let labels=[], spin=0;

function disc(){
  const c=document.createElement("canvas"); c.width=c.height=64;
  const g=c.getContext("2d"), r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.42,"rgba(255,255,255,.55)");
  r.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=r; g.beginPath(); g.arc(32,32,32,0,7); g.fill();
  return new THREE.CanvasTexture(c);
}

async function buildStage(){
  if(scene){ if(!raf) tick(); return; }
  const d=await (await fetch("./data_3d.json")).json();
  P=d.points;
  for(const p of P){ p.x*=S; p.y*=S; p.z*=S; byId.set(String(p.id),p); }

  renderer=new THREE.WebGLRenderer({canvas:document.getElementById("sky"),antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0a0d14);
  scene.fog=new THREE.FogExp2(0x0a0d14,0.00055);     // as space.html had it
  camera=new THREE.PerspectiveCamera(70,1,0.1,16000);

  // Field rendering restored to the original look: saturated, bright, light
  // fog. The earlier version dimmed it to make highlights pop and lost the
  // constellation in the process.
  const n=P.length, pos=new Float32Array(n*3), col=new Float32Array(n*3);
  const c=new THREE.Color(); const box=new THREE.Box3();
  for(let i=0;i<n;i++){ const p=P[i];
    pos[i*3]=p.x; pos[i*3+1]=p.y; pos[i*3+2]=p.z;
    c.setHSL((Math.atan2(p.z,p.x)/(2*Math.PI))+0.5, 0.55, 0.6);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    box.expandByPoint(new THREE.Vector3(p.x,p.y,p.z));
  }
  box.getCenter(centre); spread=box.getSize(new THREE.Vector3()).length();

  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
  geo.setAttribute("color",new THREE.BufferAttribute(col,3));
  field=new THREE.Points(geo,new THREE.PointsMaterial({size:3.4,sizeAttenuation:true,
    map:disc(),vertexColors:true,transparent:true,alphaTest:0.35,depthWrite:true,fog:true}));
  scene.add(field);

  const lgeo=new THREE.BufferGeometry();
  lgeo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(32*3),3));
  lgeo.setAttribute("color",new THREE.BufferAttribute(new Float32Array(32*3),3));
  lgeo.setDrawRange(0,0);
  lit=new THREE.Points(lgeo,new THREE.PointsMaterial({size:17,sizeAttenuation:true,
    map:disc(),vertexColors:true,transparent:true,opacity:0,depthWrite:false,
    blending:THREE.AdditiveBlending}));
  scene.add(lit);

  halo=new THREE.Sprite(new THREE.SpriteMaterial({map:disc(),color:0xffd9a0,
    transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.setScalar(150); scene.add(halo);

  addEventListener("resize",fit); fit(); tick();
}
function fit(){ if(!renderer) return;
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }

/* scripted camera: a tween, not a free orbit — the shot is part of the lesson */
function flyTo(posV, tgtV, dur){
  cam.fromP.copy(cam.pos); cam.fromT.copy(cam.tgt);
  cam.toP.copy(posV); cam.toT.copy(tgtV); cam.t=0; cam.dur=dur;
}
function wideShot(){
  const d=spread*0.78;
  cam.pos.set(centre.x+d*0.35, centre.y+d*0.3, centre.z+d);
  cam.tgt.copy(centre); cam.t=1;
}
const easeIO = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

function tick(){
  raf=requestAnimationFrame(tick);
  if(cam.t<1){
    cam.t=Math.min(1,cam.t+(1/60)/cam.dur);
    const e=easeIO(cam.t);
    cam.pos.lerpVectors(cam.fromP,cam.toP,e);
    cam.tgt.lerpVectors(cam.fromT,cam.toT,e);
  }
  spin+=0.00022;                              // a touch of drift on the wide shot
  const r=cam.pos.clone().sub(cam.tgt);
  r.applyAxisAngle(new THREE.Vector3(0,1,0), spin*(cam.t<1?0.25:1));
  camera.position.copy(cam.tgt.clone().add(r));
  camera.lookAt(cam.tgt);
  if(lit.material.opacity < (lit.userData.want||0)) lit.material.opacity+=0.03;
  if(halo.material.opacity < (halo.userData.want||0)) halo.material.opacity+=0.012;
  halo.scale.setScalar(150+18*Math.sin(performance.now()/420));
  renderer.render(scene,camera);
  drawLabels();
}

/* ── highlighting and labelling ─────────────────────────────────────────── */
function lightRegion(pos){
  if(!pos) return;
  halo.position.set(pos[0]*S,pos[1]*S,pos[2]*S);
  halo.userData.want=0.55; halo.material.opacity=0;
}
function lightTracks(tracks){
  const pts=[],cols=[],c=new THREE.Color();
  tracks.forEach(t=>{
    const p=byId.get(String(t.track_id)); if(!p) return;
    pts.push(p.x,p.y,p.z);
    c.set(t.wildcard?0x9fc4ef:0xffffff);
    const g=0.45+0.55*(t.relevance??1);
    cols.push(c.r*g,c.g*g,c.b*g);
  });
  const n=Math.min(pts.length/3,32);
  const pa=lit.geometry.getAttribute("position"), ca=lit.geometry.getAttribute("color");
  for(let i=0;i<n*3;i++){ pa.array[i]=pts[i]; ca.array[i]=cols[i]; }
  pa.needsUpdate=true; ca.needsUpdate=true; lit.geometry.setDrawRange(0,n);
  lit.material.opacity=0; lit.userData.want=1;
}
function setLabels(tracks){
  labelsEl.innerHTML=""; labels=[];
  tracks.forEach(t=>{
    const p=byId.get(String(t.track_id)); if(!p) return;
    const d=el("div","lab"+(t.wildcard?" wild":""));
    const b=el("b",null,t.name); d.appendChild(b);
    d.appendChild(el("span",null,"  "+t.artist));
    labelsEl.appendChild(d);
    labels.push({d, v:new THREE.Vector3(p.x,p.y,p.z)});
  });
}
function showLabels(){ labels.forEach((l,i)=>setTimeout(()=>l.d.classList.add("in"),i*180)); }
function drawLabels(){
  if(!labels.length||!camera) return;
  const w=innerWidth/2, h=innerHeight/2;
  for(const l of labels){
    const v=l.v.clone().project(camera);
    if(v.z>1){ l.d.style.display="none"; continue; }
    l.d.style.display="";
    l.d.style.left=(v.x*w+w)+"px"; l.d.style.top=(-v.y*h+h)+"px";
  }
}
function clearStage(){
  labelsEl.innerHTML=""; labels=[];
  if(lit){ lit.userData.want=0; lit.material.opacity=0; lit.geometry.setDrawRange(0,0); }
  if(halo){ halo.userData.want=0; halo.material.opacity=0; }
}

/* ── the explainer sequence ─────────────────────────────────────────────── */
async function enterStage(){
  document.body.classList.add("dimming");
  const ready=buildStage();
  await wait(2200);
  await ready;
  clearStage(); clearSteps(); wideShot();
  document.body.classList.add("showing");
  await wait(1100);
}
async function leaveStage(){
  retEl.classList.add("show");
  await wait(1600);
  document.body.classList.remove("showing","dimming");
  retEl.classList.remove("show");
  clearSteps(); clearStage();
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  q.placeholder="What do you feel like?";
}

/* ── talking ────────────────────────────────────────────────────────────── */
async function boot(){
  try{
    const r=await fetch(API+"/api/chat/config",{headers:H()});
    const c=await r.json();
    if(!r.ok) throw new Error(c.error||r.status);
    sub.textContent=c.tracks.toLocaleString()+" tracks";
    if(!c.live){
      sub.textContent+=" · offline"; go.disabled=true; q.disabled=true;
      bubble("bot","I can't chat just now — the server has no model configured."
        +(c.reason?"\n\n"+c.reason+".":"")); return;
    }
    const s=await fetch(API+"/api/chat/session",{method:"POST",headers:H()});
    session=(await s.json()).session;
    bubble("bot","Tell me what you're after — a mood, a setting, or how you want it "
      +"to sound. I'll find three from the library, and one from further out.");
  }catch(e){
    sub.textContent="offline"; go.disabled=true;
    bubble("bot","").appendChild(el("div","err","Can't reach the server ("+e.message+")."));
  }
}

tog.onclick=()=>{ showMech=!showMech;
  tog.textContent="show the mechanism: "+(showMech?"on":"off");
  tog.classList.toggle("on",showMech); };

async function send(){
  const text=q.value.trim();
  if(!text||busy) return;

  if(!unlocked && norm(text)===norm(CODEWORD)){
    q.value=""; q.style.height="auto";
    bubble("me",text);
    bubble("bot","Enjoy the show.");
    unlocked=true; tog.hidden=false; tog.classList.add("on");
    await wait(900);
    bubble("bot","From now on I'll show you how I actually find them. Ask me for "
      +"something.");
    return;
  }

  busy=true; go.disabled=true;
  q.value=""; q.style.height="auto";
  bubble("me",text);
  const staged = unlocked && showMech;
  if(staged) await enterStage();
  const dots = staged ? null : bubble("bot","…");

  let reply="", allTracks=null, lastPos=null, n=0;
  try{
    if(staged){
      await step(++n,"you typed", d=>{ d.appendChild(el("div","b",text)); });
      await wait(1100);
    }
    const r=await fetch(API+"/api/chat/stream",{method:"POST",headers:H(),
      body:JSON.stringify({session,message:text})});
    if(!r.ok||!r.body){ const e=await r.json().catch(()=>({}));
      throw new Error(e.error||("server "+r.status)); }
    const rd=r.body.getReader(), dec=new TextDecoder(); let buf="";
    while(true){
      const {value,done}=await rd.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split("\n\n"); buf=parts.pop();
      for(const part of parts){
        const line=part.split("\n").find(l=>l.startsWith("data: "));
        if(!line) continue;
        let ev; try{ ev=JSON.parse(line.slice(6)); }catch(e){ continue; }
        if(ev.type==="session") session=ev.session;
        if(ev.type==="reply") reply+=ev.text||"";
        if(ev.type==="tracks") allTracks=ev.results||allTracks;
        if(!staged) continue;

        if(ev.type==="structuring"){
          await step(++n,"claude structured it", d=>{
            const m=el("div","mono",
              "search_by_description(\n  descriptions=[\n"
              + (ev.descriptions||[]).map(x=>'    "'+x+'"').join(",\n")
              + "\n  ]\n)");
            d.appendChild(m);
            d.appendChild(el("div","note","your words, turned into descriptions of sound"));
          });
          await wait(2100);
          await step(++n,"what clap is given, verbatim", d=>{
            d.appendChild(el("div","lit",(ev.embedded||[]).join("\n")));
            const bits=[];
            if(ev.averaged) bits.push((ev.embedded||[]).length+" vectors, averaged");
            bits.push("L2-normalised"); bits.push(ev.dims+"-d");
            d.appendChild(el("div","note",
              'every description is wrapped in the template ' + JSON.stringify(ev.template||"")));
            d.appendChild(el("div","note","text encoder → "+bits.join("  ·  ")));
          });
          await wait(2300);
        }
        else if(ev.type==="reference"){
          await step(++n,"taking a bearing from a track", d=>{
            d.appendChild(el("div","b",(ev.artists||[ev.track]).filter(Boolean).join(" · ")));
            d.appendChild(el("div","note",
              "CLAP cannot read names, so this is resolved in the metadata and "
              +"searched audio-to-audio instead"));
          });
          await wait(1900);
        }
        else if(ev.type==="correction"){
          await step(++n,"correction", d=>{
            d.appendChild(el("div","lit",(ev.axes||[]).map(a=>
              (a.sign||"+")+" "+a.axis+"   ("+(a.magnitude||"moderate")+")").join("\n")
              || "on your feedback"));
            d.appendChild(el("div","note","the query vector is moved along validated axes"));
          });
          await wait(1800);
        }
        else if(ev.type==="tracks"){
          const ts=ev.results||[];
          await step(++n,"where that lands", d=>{
            d.appendChild(el("div","b","the embedded query sits in this region"));
            d.appendChild(el("div","note","shown at the centroid of what it matched — "
              +"the 3-D view is a projection of 512 dimensions, not the space itself"));
          });
          lightRegion(ev.position);
          // wide establishing shot, then in to the neighbourhood
          await wait(1500);
          if(ev.position){
            flyTo(new THREE.Vector3(ev.position[0]*S+170, ev.position[1]*S+110, ev.position[2]*S+200),
                  new THREE.Vector3(ev.position[0]*S, ev.position[1]*S, ev.position[2]*S), 4.2);
          }
          await wait(3600);
          await step(++n,"nearest neighbours in 512-d", d=>{
            d.appendChild(el("div","b","cosine similarity against every track"));
            d.appendChild(el("div","note","computed in the full 512 dimensions — so the "
              +"matches need not look adjacent on this projection"));
          });
          lightTracks(ts); setLabels(ts);
          await wait(1300);
          showLabels();
          await wait(2200);
          lastPos=ev.position||lastPos;
        }
        else if(ev.type==="error" && !ev.recoverable){
          await step(++n,"error", d=>{ d.appendChild(el("div","err",ev.message)); });
        }
      }
    }
    if(staged){ await wait(1400); await leaveStage(); }
    if(dots) dots.textContent = reply || "(no reply)";
    else if(reply) bubble("bot", reply);
    if(allTracks) foyerTracks(allTracks);
  }catch(e){
    if(staged) await leaveStage();
    if(dots){ dots.textContent=""; dots.appendChild(el("div","err",e.message)); }
    else bubble("bot","").appendChild(el("div","err",e.message));
  }finally{ busy=false; go.disabled=false; q.focus(); }
}

go.onclick=send;
q.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});
q.addEventListener("input",()=>{ q.style.height="auto";
  q.style.height=Math.min(q.scrollHeight,120)+"px"; });
boot();
</script>
