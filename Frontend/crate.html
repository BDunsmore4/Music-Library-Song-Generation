<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate · Taste Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111827; --surface:#161c27; --surface-2:#1d2436;
  --border:#242d3f; --border-2:#2e3a50;
  --text:#dce3f0; --muted:#7a8699; --faint:#3a4560;
  --accent:#4f8ef7; --amber:#c8982e; --sage:#3da870; --coral:#d45f5f;
  --radius:6px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; font-size:13px; line-height:1.55;
  display:flex; flex-direction:column;
}
header{
  display:flex; align-items:center; gap:14px; flex:0 0 auto;
  padding:12px 18px; border-bottom:1px solid var(--border); background:var(--surface);
}
header h1{margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em}
header .meta{color:var(--muted); font-size:11.5px}
header a{margin-left:auto; color:var(--muted); text-decoration:none; font-size:12px}
header a:hover{color:var(--accent)}

main{flex:1 1 auto; overflow-y:auto; padding:22px 18px 8px}
.thread{max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:18px}

.msg{display:flex}
.msg.me{justify-content:flex-end}
.msg.me .body{
  background:var(--surface-2); border:1px solid var(--border-2);
  border-radius:var(--radius); padding:7px 11px; max-width:78%;
}
.msg.bot .body{max-width:100%; white-space:pre-wrap}

/* track list — deliberately a list, not cards */
.tracks{display:flex; flex-direction:column; margin-top:2px}
.track{
  display:flex; align-items:center; gap:11px;
  padding:8px 10px; border-radius:var(--radius);
  border:1px solid transparent;
}
.track:hover{background:var(--surface); border-color:var(--border)}
.track.wild{border-left:2px solid var(--amber); border-radius:0 var(--radius) var(--radius) 0}
.play{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; cursor:pointer;
  border:1px solid var(--border-2); background:var(--surface-2); color:var(--text);
  display:flex; align-items:center; justify-content:center; font-size:10px; padding:0;
}
.play:hover{border-color:var(--accent); color:var(--accent)}
.play.on{background:var(--accent); border-color:var(--accent); color:#fff}
.play[disabled]{opacity:.3; cursor:default}
.info{min-width:0; flex:1 1 auto}
.name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.artist{color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tag{
  flex:0 0 auto; color:var(--amber); font-size:10px; letter-spacing:.04em;
  text-transform:uppercase; border:1px solid rgba(200,152,46,.35);
  border-radius:3px; padding:1px 5px;
}
.vote{flex:0 0 auto; display:flex; gap:3px; opacity:0; transition:opacity .12s}
.track:hover .vote, .vote.set{opacity:1}
.vote button{
  width:24px; height:24px; padding:0; cursor:pointer; font-size:11px;
  background:none; border:1px solid var(--border-2); border-radius:4px; color:var(--muted);
}
.vote button:hover{color:var(--text); border-color:var(--border-2)}
.vote button.up.on{color:var(--sage); border-color:var(--sage)}
.vote button.down.on{color:var(--coral); border-color:var(--coral)}

.note{color:var(--muted); font-size:11.5px}
.err{color:var(--coral); font-size:12px}
.dots span{
  display:inline-block; width:4px; height:4px; margin-right:3px; border-radius:50%;
  background:var(--muted); animation:b 1.1s infinite;
}
.dots span:nth-child(2){animation-delay:.16s}
.dots span:nth-child(3){animation-delay:.32s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

footer{
  flex:0 0 auto; border-top:1px solid var(--border); background:var(--surface);
  padding:12px 18px;
}
.composer{max-width:680px; margin:0 auto; display:flex; gap:8px}
textarea{
  flex:1 1 auto; resize:none; font:inherit; color:var(--text);
  background:var(--bg); border:1px solid var(--border-2); border-radius:var(--radius);
  padding:9px 11px; max-height:120px; min-height:38px;
}
textarea:focus{outline:none; border-color:var(--accent)}
textarea::placeholder{color:var(--faint)}
button.send{
  flex:0 0 auto; font:inherit; font-weight:500; cursor:pointer; padding:0 16px;
  background:var(--accent); color:#fff; border:1px solid var(--accent);
  border-radius:var(--radius);
}
button.send[disabled]{opacity:.45; cursor:default}
@media (max-width:620px){
  main{padding:16px 12px 4px}
  .vote{opacity:1}
  .artist{font-size:11px}
}

/* The chat is a breakable pane above the existing, real Taste Space. */
body{overflow:hidden}
#space-layer{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#0a0d14}
#glass-pane{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#glass-pane main{min-height:0}
#cracks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;filter:drop-shadow(0 1px 1px #000)}
.reveal-tools{max-width:680px;margin:9px auto 0;display:flex;justify-content:flex-end;gap:10px;align-items:center}
.reveal-tools button,#strike,#return-chat{font:inherit;color:var(--text);border:1px solid var(--border-2);background:var(--surface-2);border-radius:6px;padding:9px 13px;cursor:pointer}
#reveal-status{font-size:11px;color:#aab7ca}
#tool-rig{position:fixed;right:24px;bottom:150px;z-index:8;display:none;text-align:center}
#tool-rig svg{display:block;width:150px;height:150px;overflow:visible;filter:drop-shadow(0 8px 8px #0008)}
#tool-rig.equipped{display:block}
#hammer{transform-origin:112px 119px}
#tool-rig.swing #hammer{animation:hammer-strike .32s ease-in-out}
@keyframes hammer-strike{0%{transform:rotate(0)}35%{transform:rotate(38deg)}65%{transform:rotate(-28deg)}100%{transform:rotate(0)}}
#return-chat{position:fixed;right:18px;top:48px;z-index:9}
#shards{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden;perspective:1000px}
.glass-shard{position:absolute;inset:0;will-change:transform,opacity;pointer-events:none}
.glass-shard #glass-pane{position:absolute}
[hidden]{display:none!important}
@media(max-width:620px){#tool-rig{right:10px;bottom:165px}#tool-rig svg{width:110px;height:110px}.reveal-tools{flex-wrap:wrap}#reveal-status{max-width:190px}}
@media(prefers-reduced-motion:reduce){#tool-rig.swing #hammer{animation:none}}

</style>
</head>
<body>
<iframe id="space-layer" title="Interactive song constellation" src="./space?embedded=1" tabindex="-1" inert></iframe>
<div id="glass-pane">

<header>
  <h1>Crate</h1>
  <span class="meta" id="meta">connecting…</span>
  <a href="./index.html">← map</a>
</header>

<main id="main">
  <div class="thread" id="thread"></div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="What do you feel like? e.g. something for cooking on a rainy Sunday"></textarea>
    <button class="send" id="send">Send</button>
  </div>
  <div class="reveal-tools">
    <span id="reveal-status" role="status">There’s a world behind this conversation.</span>
    <button id="equip" type="button">Hammer &amp; chisel ↗</button>
  </div>
</footer>
<svg id="cracks" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
</div>
<div id="tool-rig">
  <svg viewBox="0 0 160 150" aria-hidden="true">
    <defs><linearGradient id="steel"><stop stop-color="#718096"/><stop offset=".45" stop-color="#eef6ff"/><stop offset="1" stop-color="#687b94"/></linearGradient></defs>
    <path d="M29 134 L49 74 L61 78 L34 137Z" fill="url(#steel)" stroke="#c7d5e6"/>
    <path d="M47 76 L52 57 L68 62 L61 81Z" fill="#b47c48" stroke="#e4b580"/>
    <g id="hammer"><path d="M107 126 L68 57 L79 50 L119 119Z" fill="#ae7544" stroke="#edbd85" stroke-width="2"/><path d="M45 37 Q42 31 49 28 L88 15 Q94 14 97 22 L102 37 Q104 44 98 46 L60 61 Q53 63 51 56Z" fill="url(#steel)" stroke="#e7effc" stroke-width="2"/></g>
  </svg>
  <button id="strike" type="button">Strike · Space</button>
</div>
<div id="shards" aria-hidden="true" hidden></div>
<button id="return-chat" type="button" hidden>← Back to Crate</button>

<script>
// Backend. Same convention as index.html's CLAP_SERVER.
const API_DEFAULT = "https://music-library-song-generation-production.up.railway.app";

// ?api=... lets a Pages preview talk to a Railway staging service without
// editing this file. Restricted to Railway hosts and localhost, because a page
// that will POST a conversation to any URL a link supplies is a handy way to
// get someone's chat sent somewhere else.
function resolveApi(){
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    return "http://localhost:8765";
  const want = new URLSearchParams(location.search).get("api");
  if (want) {
    try {
      const u = new URL(want);
      const ok = u.protocol === "https:" &&
                 (u.hostname.endsWith(".up.railway.app") || u.hostname.endsWith(".railway.app"));
      if (ok) return u.origin;
      console.warn("ignoring ?api= — not a Railway https host:", want);
    } catch (e) { console.warn("ignoring unparseable ?api=", want); }
  }
  return API_DEFAULT;
}
const API = resolveApi();

// Leave this empty. Anything shipped to a browser is readable, so a value here
// is obfuscation, not security — and if *.html is ever un-ignored for the
// Docker build it would be baked into the image and into git too. The real
// backstop is a spend cap on the Anthropic account. See DEPLOYMENT.md §8.
const CHAT_KEY = "";

const thread = document.getElementById("thread");
const input  = document.getElementById("input");
const send   = document.getElementById("send");
const meta   = document.getElementById("meta");

let session = null, busy = false, audio = null, playing = null;

const headers = () => {
  const h = {"Content-Type": "application/json"};
  if (CHAT_KEY) h["X-Chat-Key"] = CHAT_KEY;
  return h;
};

function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function scroll(){
  const m = document.getElementById("main");
  m.scrollTop = m.scrollHeight;
}

function addMessage(who, text){
  const row = el("div", "msg " + who);
  row.appendChild(el("div", "body", text));
  thread.appendChild(row);
  scroll();
  return row;
}

function thinking(){
  const row = el("div", "msg bot");
  const b = el("div", "body");
  const d = el("div", "dots");
  d.innerHTML = "<span></span><span></span><span></span>";
  b.appendChild(d); row.appendChild(b);
  thread.appendChild(row); scroll();
  return row;
}

// one shared element, so a new preview always stops the last one
function playPreview(url, btn){
  if (playing === btn){ audio.pause(); return; }
  if (audio) audio.pause();
  audio = new Audio(url);
  audio.play().catch(() => { btn.textContent = "—"; btn.disabled = true; });
  if (playing) { playing.classList.remove("on"); playing.textContent = "▶"; }
  playing = btn; btn.classList.add("on"); btn.textContent = "❙❙";
  audio.onended = audio.onpause = () => {
    btn.classList.remove("on"); btn.textContent = "▶";
    if (playing === btn) playing = null;
  };
}

function vote(trackId, rating, group, pressed){
  group.querySelectorAll("button").forEach(b => b.classList.remove("on"));
  pressed.classList.add("on");
  group.classList.add("set");
  fetch(API + "/api/chat/feedback", {
    method: "POST", headers: headers(),
    body: JSON.stringify({session, track_id: trackId, rating, source: "ui"})
  }).catch(() => {});
}

function addTracks(tracks){
  if (!tracks || !tracks.length) return;
  const wrap = el("div", "tracks");
  tracks.forEach(t => {
    const row = el("div", "track" + (t.wildcard ? " wild" : ""));

    const play = el("button", "play", t.preview_url ? "▶" : "—");
    if (!t.preview_url) play.disabled = true;
    else play.onclick = () => playPreview(t.preview_url, play);
    row.appendChild(play);

    const info = el("div", "info");
    info.appendChild(el("div", "name", t.name));
    info.appendChild(el("div", "artist", t.artist));
    row.appendChild(info);

    if (t.wildcard) row.appendChild(el("span", "tag", "further out"));

    const group = el("div", "vote");
    const up = el("button", "up", "▲"), down = el("button", "down", "▼");
    up.title = "this worked"; down.title = "not this";
    up.onclick   = () => vote(t.track_id, 1, group, up);
    down.onclick = () => vote(t.track_id, 0, group, down);
    group.appendChild(up); group.appendChild(down);
    row.appendChild(group);

    wrap.appendChild(row);
  });
  const row = el("div", "msg bot");
  row.appendChild(wrap);
  thread.appendChild(row);
  scroll();
}

async function boot(){
  try {
    const r = await fetch(API + "/api/chat/config", {headers: headers()});
    const c = await r.json();
    if (!r.ok) throw new Error(c.error || r.status);
    meta.textContent = c.tracks.toLocaleString() + " tracks";
    if (!c.live){
      meta.textContent += " · chat offline";
      send.disabled = true; input.disabled = true;
      addMessage("bot", "The server has no model configured, so I can't chat right now."
        + (c.reason ? "\n\n" + c.reason + "." : ""));
      return;
    }
    const s = await fetch(API + "/api/chat/session", {method: "POST", headers: headers()});
    session = (await s.json()).session;
    addMessage("bot", "Tell me what you're after — a mood, a setting, or how you want it to sound. I'll pull three from your library, plus one from further out.");
  } catch (e) {
    meta.textContent = "offline";
    send.disabled = true;
    const row = addMessage("bot", "");
    row.querySelector(".body").appendChild(
      el("div", "err", "Can't reach the server (" + e.message + "). Check API at the top of this file."));
  }
}

async function say(){
  const text = input.value.trim();
  if (!text || busy) return;
  if (isRevealRequest(text)) {
    input.value = ""; input.style.height = "auto";
    addMessage("me", text); equipTools(); return;
  }
  busy = true; send.disabled = true;
  input.value = ""; input.style.height = "auto";
  addMessage("me", text);
  const wait = thinking();

  try {
    const r = await fetch(API + "/api/chat", {
      method: "POST", headers: headers(),
      body: JSON.stringify({session, message: text})
    });
    const d = await r.json();
    wait.remove();
    if (!r.ok) throw new Error(d.error || ("server " + r.status));
    if (d.session) session = d.session;
    if (d.reply) addMessage("bot", d.reply);
    addTracks(d.tracks);
  } catch (e) {
    wait.remove();
    const row = addMessage("bot", "");
    row.querySelector(".body").appendChild(el("div", "err", e.message));
  } finally {
    busy = false; send.disabled = false; if(revealState==='chat') input.focus();
  }
}

send.onclick = say;
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); say(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

// Local reveal commands never consume a model turn or change the chat session.
const pane = document.getElementById('glass-pane');
const space = document.getElementById('space-layer');
const rig = document.getElementById('tool-rig');
const cracks = document.getElementById('cracks');
const statusLine = document.getElementById('reveal-status');
const strikeButton = document.getElementById('strike');
const returnButton = document.getElementById('return-chat');
let revealState = 'chat', hits = 0, lastStrike = -Infinity;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
function isRevealRequest(text){
  return /\b(hammer|chisel)\b|\bshow me (how (this|it) works|the (space|constellation))\b|\bbreak (the )?(glass|screen)\b/i.test(text);
}
function equipTools(){
  if (revealState !== 'chat') return;
  revealState = 'armed'; rig.classList.add('equipped');
  document.getElementById('equip').disabled = true;
  statusLine.textContent = 'Five strikes. Press Space or tap Strike.';
  addMessage('bot', 'Here’s your hammer and chisel. Five strikes will open the space behind the chat. Press Space, or tap Strike.');
  input.blur(); strikeButton.focus();
}
function growCracks(){
  // Normalised coordinates keep existing fractures intact when the screen resizes.
  const ox=790, oy=690;
  const ns='http://www.w3.org/2000/svg';
  const path=(points, width, opacity)=>{
    const p=document.createElementNS(ns,'polyline');
    p.setAttribute('points',points.map(p=>p.join(',')).join(' '));
    p.setAttribute('fill','none');p.setAttribute('stroke','#d8ecff');
    p.setAttribute('stroke-width',width);p.setAttribute('opacity',opacity);
    p.setAttribute('vector-effect','non-scaling-stroke');cracks.appendChild(p);
  };
  for(let ray=0;ray<12;ray++){
    const angle=ray*Math.PI/6+.16*Math.sin(ray*7);
    const start=(hits-1)*150, end=hits*150;
    const pts=[];
    for(let r=start;r<=end;r+=15){
      const wobble=Math.sin(r*.13+ray*4)*10;
      pts.push([ox+Math.cos(angle)*r-Math.sin(angle)*wobble,oy+Math.sin(angle)*r+Math.cos(angle)*wobble]);
    }
    path(pts, hits===1?1.5:1,.85);
    const b=pts[5], a=angle+(ray%2? .55:-.6);
    path([b,[b[0]+Math.cos(a)*38,b[1]+Math.sin(a)*38],[b[0]+Math.cos(a+.2)*85,b[1]+Math.sin(a+.2)*85]],.65,.6);
    if(ray>0 && hits>1){
      const r=start+65;
      path([[ox+Math.cos(angle)*r,oy+Math.sin(angle)*r],[ox+Math.cos(angle-.25)*(r+20),oy+Math.sin(angle-.25)*(r+20)],[ox+Math.cos(angle-.52)*r,oy+Math.sin(angle-.52)*r]],.6,.4);
    }
  }
}
async function shatter(){
  revealState='breaking'; rig.classList.remove('equipped');
  if(audio) audio.pause();
  // Same-origin bridge keeps audio activation within the fifth user gesture.
  space.contentWindow.crateSpace.enter();
  pane.inert=true;
  const shards=document.getElementById('shards');
  if(!reducedMotion.matches){
    shards.hidden=false;
    const animations=[];
    for(let i=0;i<16;i++){
      const a=i*Math.PI/8, b=(i+1)*Math.PI/8;
      const poly=`polygon(79% 69%, ${79+180*Math.cos(a)}% ${69+180*Math.sin(a)}%, ${79+180*Math.cos(b)}% ${69+180*Math.sin(b)}%)`;
      const shard=document.createElement('div');shard.className='glass-shard';shard.style.clipPath=poly;
      const copy=pane.cloneNode(true);copy.inert=true;
      copy.querySelectorAll('textarea').forEach(t=>t.value=input.value);
      shard.appendChild(copy);shards.appendChild(shard);
      copy.querySelector('main').scrollTop=document.getElementById('main').scrollTop;
      // Clones are visual snapshots only; remove duplicate IDs after applying layout.
      copy.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden';
      copy.querySelector('#cracks').style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5';
      copy.querySelectorAll('[id]').forEach(n=>n.removeAttribute('id'));copy.removeAttribute('id');
      animations.push(shard.animate([{transform:'translate3d(0,0,0) rotate(0)',opacity:1},{transform:`translate3d(${Math.cos(a)*240}px,${innerHeight*1.4}px,${70+i*12}px) rotate(${(i%2?1:-1)*(15+i*4)}deg)`,opacity:0}],{duration:1000+i*23,delay:i*13,easing:'cubic-bezier(.45,0,.85,.5)',fill:'forwards'}).finished);
    }
    pane.hidden=true;
    await Promise.allSettled(animations);
    shards.replaceChildren();shards.hidden=true;
  } else pane.hidden=true;
  space.inert=false;space.tabIndex=0;space.focus();
  revealState='space';returnButton.hidden=false;
}
function strike(){
  if(revealState!=='armed'||performance.now()-lastStrike<360)return;
  const bridge=space.contentWindow.crateSpace;
  if(hits===4&&!bridge?.ready){statusLine.textContent=bridge?.error ? 'The constellation could not load. Reload the page to try again.' : 'The constellation is still loading. Try the final strike shortly.';return;}
  lastStrike=performance.now();hits++;
  rig.classList.remove('swing');void rig.offsetWidth;rig.classList.add('swing');
  growCracks();statusLine.textContent=`${hits} / 5 strikes`;
  if(hits===5)shatter();
}
document.getElementById('equip').onclick=equipTools;
strikeButton.onclick=strike;
addEventListener('keydown',e=>{
  if(e.code!=='Space'||revealState!=='armed'||e.repeat)return;
  if(e.target.closest('textarea,input,[contenteditable="true"]'))return;
  e.preventDefault();strike();
});
returnButton.onclick=()=>{
  space.contentWindow.crateSpace.pause();space.inert=true;space.tabIndex=-1;
  returnButton.hidden=true;pane.hidden=false;pane.inert=false;
  hits=0;lastStrike=-Infinity;revealState='chat';cracks.replaceChildren();
  document.getElementById('equip').disabled=false;
  statusLine.textContent='There’s a world behind this conversation.';
  document.getElementById('equip').focus();
};
boot();
</script>
</body>
</html>
